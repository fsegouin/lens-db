name: eBay Price Pipeline (Browse API)

# Replaces the scraped sold-listing pipeline, which eBay's bot wall closed in
# July 2026 for sold-search pages.
#
# Two passes, resolve first:
#   resolve: the runner reads each ended listing's own page (/itm/<id>) in a
#            browser and the cron route decides. The Browse API reports a
#            listing its seller pulled in the same shape as a sale, and the
#            page is the only place the two differ. Browse is still asked for
#            a confirmed sale's price and for pages with no banner, about
#            half the pages read.
#   asking: one Browse call per entity, records the day's asking aggregate
#           and starts watching a sample of the live listings. The route
#           ingests each batch several entities at a time; an entity is
#           almost entirely waiting, so overlapping them costs no extra
#           calls and is what keeps the run short.
#
# Resolve goes first because the two passes draw on one daily allowance and
# nothing divides it between them. Asking will spend everything down to the
# site's reserve, so whichever runs second gets what is left. On 2026-09-12
# the second run of the day started at 2,240 calls, asking took it to 370 in
# eight minutes, and resolve read no pages at all.
#
# Ordering settles it without a second budget to keep in step: resolve is the
# cheap one (217 Browse calls for 800 pages on 2026-09-12) and the urgent one,
# since a listing has to be read while the page is still up. Asking is a
# rotation over the whole catalogue and loses nothing by resuming tomorrow.

on:
  schedule:
    # eBay's daily Browse allowance rolls over at 07:00 UTC, not midnight, so
    # this runs just after it. At 06:00 a sweep started on the tail of the
    # expiring window and crossed the boundary partway through, splitting its
    # spend across two days' allowances and leaving neither cleanly accounted.
    - cron: "15 7 * * *"
    # A second slot, because GitHub delays scheduled workflows under load and
    # has been missing whole days: one run fired nearly five hours late and the
    # next never arrived. A missed day stalls the rotation outright.
    #
    # Safe to run twice because neither pass can overspend. Both routes read
    # eBay's remaining allowance before every batch and stop at the reserve, so
    # two runs share one day's quota rather than doubling it, and entities
    # already swept today are skipped. On days when both fire the catalogue
    # simply gets through more of itself.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      asking_budget:
        description: "Max asking calls (1 per entity)"
        default: "1600"
      resolve_budget:
        description: "Max listing pages read (1 per listing due a check)"
        default: "800"

permissions:
  contents: read

jobs:
  browse-pipeline:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      # API_URL and CRON_SECRET are set on the two steps that call the API
      # rather than here. npm ci runs third-party lifecycle scripts, and a
      # job-level secret sits in the environment of every one of them, so a
      # single compromised transitive dependency would be handed the only
      # thing protecting every /api/cron route.
      # eBay's documented default is 5000 Browse calls/day for the whole app,
      # and it could not be confirmed against the account because the
      # developer analytics scope is refused on these keys, so the split is
      # deliberately short of the ceiling. 1600 sweeps the 11,486-entity
      # catalogue in about a week, at about 1.5 calls an entity once the
      # alias and seller-word retries are counted. RESOLVE_BUDGET counts
      # listing pages, not Browse calls: about half of them cost one, and the
      # route stops spending at the same reserve the asking pass keeps for
      # the listings shown on entity pages. Resolve is served first, so this
      # budget is the one that gets what it asks for and ASKING_BUDGET is the
      # one that goes short on a day the allowance is already part spent.
      ASKING_BUDGET: ${{ inputs.asking_budget || '1600' }}
      RESOLVE_BUDGET: ${{ inputs.resolve_budget || '800' }}
      # Entities per request. Each one costs a query that scans the catalogue
      # for the longest-unseen rows and a second that counts what is still
      # due, so the fewer requests the sweep is split into the less of the
      # run is spent asking where to start. The route ingests the batch
      # several entities at a time and caps itself at 300s, which 40 clears
      # with room to spare.
      PAGE: "40"
      # Listing pages read at once in the resolve pass, each in its own
      # browser session. Raise only against the blocked-page count in the
      # run log: the pass stops itself when more than half a batch comes
      # back blocked.
      RESOLVE_CONCURRENCY: "4"
    steps:
      # The resolve pass reads listing pages in a real browser, so it needs the
      # repo and the scraper's Playwright; the asking pass below needs neither.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install script dependencies
        run: cd scraper && npm ci

      - name: Resolve ended listings into sales
        id: resolve
        # The script exits non-zero when more than half the pages came back
        # blocked, which is a real signal and must not be lost. But with
        # `set -e` a failure here would now skip the asking pass entirely,
        # which is the trap that comes with running this first. So the step
        # is allowed to fail, asking still runs, and the guard at the end of
        # the job fails the run afterwards.
        continue-on-error: true
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scraper/ebay-resolve-action.mjs

      - name: Asking-price snapshots
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # ASKING_BUDGET is the total across both catalogues, split in
          # proportion to their size so each sweeps in about the same number
          # of days: 9,299 lenses and 2,187 cameras, so roughly 80/20. Giving
          # each type the full budget instead would double the day's spend,
          # and running them off one shared counter would let whichever went
          # first eat the whole allowance and starve the other.
          LENS_BUDGET=$(( ASKING_BUDGET * 80 / 100 ))
          CAMERA_BUDGET=$(( ASKING_BUDGET - LENS_BUDGET ))
          echo "budget: $LENS_BUDGET lens + $CAMERA_BUDGET camera = $ASKING_BUDGET"
          for TYPE in lens camera; do
            case "$TYPE" in
              lens)   BUDGET=$LENS_BUDGET ;;
              camera) BUDGET=$CAMERA_BUDGET ;;
            esac
            SPENT=0
            echo "::group::asking: $TYPE (budget $BUDGET)"
            while [ "$SPENT" -lt "$BUDGET" ]; do
              RESP=$(curl -sS --fail-with-body \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$API_URL/api/cron/ebay-asking?entityType=$TYPE&limit=$PAGE")
              PROCESSED=$(jq -r '.processed // 0' <<<"$RESP")
              REMAINING=$(jq -r '.remainingToday // 0' <<<"$RESP")
              LIMITED=$(jq -r '.rateLimited // false' <<<"$RESP")
              FAILED=$(jq -r '.failed // 0' <<<"$RESP")
              SKIPPED=$(jq -r '.skipped // 0' <<<"$RESP")
              EXHAUSTED=$(jq -r '.quotaExhausted // false' <<<"$RESP")
              QUOTA=$(jq -r '.quotaRemaining // "?"' <<<"$RESP")
              SPENT=$((SPENT + PROCESSED))
              echo "  +$PROCESSED (failed $FAILED, skipped $SKIPPED, spent $SPENT, $REMAINING due, quota $QUOTA)"
              if [ "$EXHAUSTED" = "true" ]; then
                echo "  daily Browse allowance is down to its reserve; stopping"
                break
              fi
              if [ "$LIMITED" = "true" ]; then
                echo "  eBay refused further calls; stopping this pass"
                break
              fi
              # No progress means the queue is drained or every call is
              # failing. Either way, looping again achieves nothing.
              if [ "$PROCESSED" -eq 0 ] || [ "$REMAINING" -eq 0 ]; then break; fi
            done
            echo "::endgroup::"
          done

      # Fails the run when the resolve pass failed, after the asking pass has
      # had its turn. `outcome` is the step's real result; `conclusion` is the
      # one continue-on-error rewrote, so this reads the former.
      #
      # always() because a bare `if` has an implicit success() ANDed onto it:
      # without it, an asking step that fails skips this guard and the run
      # never says the resolve pass failed too.
      - name: Report a failed resolve pass
        if: always() && steps.resolve.outcome == 'failure'
        run: |
          echo "::error::The resolve pass failed; see the step above."
          exit 1
