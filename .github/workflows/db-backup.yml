name: Weekly DB Backup
# Supabase Free has no automated backups. Dump the database once a week to a
# private R2 bucket (scraper/db-backup.sh: pg_dump custom format, verified
# with pg_restore --list, 12 weekly + 12 monthly copies kept).
on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dump and verify only, skip upload"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL 17 client (matches the Supabase server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # The runner ships postgresql-client-16, so /usr/bin/pg_dump stays on
          # 16 and the dump aborts on "server version mismatch". Put 17's real
          # binaries ahead of it for this step and for every step after.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          # Fail here, with the version in hand, rather than burning the
          # script's three pg_dump retries on an error that cannot resolve.
          pg_dump --version
          case "$(pg_dump --version)" in
            *"pg_dump (PostgreSQL) 17."*) ;;
            *) echo "expected pg_dump 17.x, got: $(pg_dump --version)" >&2; exit 1 ;;
          esac
      - name: Dump, verify, upload, prune
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash scraper/db-backup.sh
