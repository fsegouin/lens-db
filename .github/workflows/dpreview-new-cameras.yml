# The camera-body half of the DPReview watcher. A separate workflow from
# dpreview-new-lenses.yml rather than a matrix job so that a camera backfill
# cannot delay the weekly lens run, a failure in one half does not mark the
# other failed, and each can be dispatched with its own page count.
#
# Scheduled an hour after the lens watcher so the two never contend for the
# same LLM and database budget.
name: DPReview New-Camera Watcher
on:
  schedule:
    - cron: "0 10 * * 1" # Mondays 10:00 UTC
  workflow_dispatch:
    inputs:
      pages:
        description: "Index pages to scan (~21 cameras/page; the full archive is ~125)"
        default: "1"
permissions:
  contents: read
jobs:
  watch-and-queue:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install script dependencies
        run: cd scraper && npm ci
      - name: Run DPReview camera watcher
        env:
          ENTITY: cameras
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PAGES: ${{ inputs.pages || '1' }}
        run: node scraper/dpreview-watch-action.mjs
      - name: Audit extracted specs (recent candidates only)
        env:
          ENTITY: cameras
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CREATE_EDITS: "1"
          RECENT_HOURS: "192" # 8 days — covers the weekly cadence with margin
        run: node scraper/dpreview-audit-cli.mjs
