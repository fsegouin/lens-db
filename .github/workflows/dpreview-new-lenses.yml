name: DPReview New-Lens Watcher
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      pages:
        description: "Index pages to scan (~21 lenses/page; use 9 for backfill)"
        default: "1"
permissions:
  contents: read
jobs:
  watch-and-queue:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install script dependencies
        run: cd scraper && npm ci
      - name: Run DPReview lens watcher
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PAGES: ${{ inputs.pages || '1' }}
        run: node scraper/dpreview-lens-watch-action.mjs
      - name: Audit extracted specs (recent candidates only)
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CREATE_EDITS: "1"
          RECENT_HOURS: "192" # 8 days — covers the weekly cadence with margin
        run: node scraper/dpreview-audit-cli.mjs
