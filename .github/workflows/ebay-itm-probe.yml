name: eBay listing page probe

# Tests whether a GitHub runner can read eBay listing pages, which is what
# checking a recorded sale against its page would need. Runs once when the
# probe itself changes, and on demand. Needs no secrets: it only reads public
# listing pages and prints what came back.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ebay-itm-probe.yml
      - scraper/ebay-itm-probe.mjs
      - scraper/lib/ebay-reader.mjs
  workflow_dispatch:
    inputs:
      readers:
        description: "Listing pages read at once, each in its own session"
        default: "4"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install script dependencies
        run: cd scraper && npm ci

      - name: Load known listing pages
        env:
          PROBE_READERS: ${{ inputs.readers || '4' }}
          # Chrome's own stderr in the log, and Playwright's note of how the
          # process ended (exit code or signal), so a death says why.
          DEBUG: pw:browser
        run: node scraper/ebay-itm-probe.mjs

      # A Chrome that vanishes without a word may have been killed by the
      # kernel; the OOM killer says so here and nowhere else.
      - name: Kernel messages about Chrome
        if: always()
        run: sudo dmesg 2>/dev/null | grep -iE 'oom|killed process|chrome|segfault' | tail -20 || true
