name: eBay listing page probe

# Tests whether a GitHub runner can read eBay listing pages, which is what
# checking a recorded sale against its page would need. Runs once when the
# probe itself changes, and on demand. Needs no secrets: it only reads public
# listing pages and prints what came back.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ebay-itm-probe.yml
      - scraper/ebay-itm-probe.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install script dependencies
        run: cd scraper && npm ci

      - name: Load known listing pages
        run: node scraper/ebay-itm-probe.mjs
