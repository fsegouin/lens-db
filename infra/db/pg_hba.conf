# The Lens DB: who may connect, from where, and how.
#
# TYPE      DATABASE  USER      ADDRESS        METHOD
# Inside the container (docker compose exec postgres psql): no password.
local       all       all                      trust
# Loopback inside the container.
host        all       all       127.0.0.1/32   scram-sha-256
host        all       all       ::1/128        scram-sha-256
# The superuser never crosses the network, TLS or not.
hostssl     all       postgres  0.0.0.0/0      reject
hostssl     all       postgres  ::/0           reject
# Everyone else: TLS plus SCRAM, from anywhere (the host firewall decides exposure).
hostssl     all       all       0.0.0.0/0      scram-sha-256
hostssl     all       all       ::/0           scram-sha-256
# Plaintext over the network is refused outright.
hostnossl   all       all       0.0.0.0/0      reject
hostnossl   all       all       ::/0           reject
