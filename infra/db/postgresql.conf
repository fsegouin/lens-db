# The Lens DB production Postgres. Whole-file config: the image points at it
# with -c config_file, so every setting the server needs lives here.

data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/postgresql/pg_hba.conf'

# Network. TLS is mandatory for anything that is not the local socket; the
# server cert is installed into /run/certs by entrypoint.sh.
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/run/certs/server.crt'
ssl_key_file = '/run/certs/server.key'
ssl_min_protocol_version = 'TLSv1.2'
tcp_keepalives_idle = 60
tcp_keepalives_interval = 15
tcp_keepalives_count = 4

# Memory, sized for a ~200 MB database on a shared host. Raise shared_buffers
# and effective_cache_size if the box has RAM to spare.
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB
dynamic_shared_memory_type = posix

# WAL and checkpoints.
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# pg_stat_statements: Supabase had it preinstalled; it is how egress and
# hot queries were measured. The extension itself is created by initdb/.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 5000

# Logging goes to the container's stderr (docker compose logs postgres).
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %u@%d %h '
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_timezone = 'UTC'

# Safety valves for a public-facing port.
idle_in_transaction_session_timeout = 60000
statement_timeout = 0
lock_timeout = 0

timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
